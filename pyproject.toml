[project]
name = "medical-evidence-finder"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "jenjen2424", email = "jennifer.ma@betterage.net" }
]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.113",
